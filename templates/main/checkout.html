{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 900px;">
    <h2 class="text-center mb-4">Оформлення замовлення</h2>

    <div class="row g-4">
        <div class="col-lg-6">
            <form method="post">
                {% csrf_token %}

                <input type="text" name="customer_name" class="form-control mb-2"
                       placeholder="Імʼя та прізвище" required>

                <input type="text" name="phone" class="form-control mb-2"
                       placeholder="Телефон" required>

                <textarea name="delivery_address" class="form-control mb-2"
                          placeholder="Адреса доставки" required></textarea>

                <select name="payment_method" class="form-select mb-2" required>
                    <option value="cash">Готівка при отриманні</option>
                    <option value="online">Онлайн-оплата</option>
                </select>

                <textarea name="comment" class="form-control mb-2"
                          placeholder="Коментар (необовʼязково)"></textarea>

                <button class="btn btn-success w-100">Підтвердити замовлення</button>
                <a href="{% url 'cart_detail' %}" class="btn btn-outline-secondary w-100 mt-2">
                    Назад у кошик
                </a>
            </form>
        </div>

        <div class="col-lg-6">
            <h5>Ваше замовлення</h5>
            <ul class="list-group mb-3">
                {% for item in items %}
                <li class="list-group-item d-flex justify-content-between">
                    {{ item.dish.name }} × {{ item.quantity }}
                    <span>{{ item.total_price }} грн</span>
                </li>
                {% endfor %}
            </ul>
            <h5 class="text-end">Разом: <strong>{{ total }} грн</strong></h5>
        </div>
    </div>
</div>
{% endblock %}
